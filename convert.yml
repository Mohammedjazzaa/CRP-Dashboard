name: Excel to JSON

on:
  push:
    branches: [main]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
      - run: npm install xlsx
      - run: node convert.js
      - run: |
          git config user.email "auto@github.com"
          git config user.name "Auto Update"
          git add data.json
          git commit -m "Auto: Update data.json" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
